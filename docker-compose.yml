# Local run with MongoDB included:  docker compose up --build
# API → http://localhost:5090  (demo data is seeded on first start)
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5090:5090"
    environment:
      PORT: "5090"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: arangam
      JWT_SECRET: ${JWT_SECRET:-local-docker-secret-change-me-0123456789abcdef}
      SEED_DEMO_DATA: "true"
      CLIENT_ORIGINS: ""

volumes:
  mongo-data:
