name: Android APK

# Builds an installable APK on GitHub's own runner (it has the Android SDK and Java),
# so no Expo account or local Android setup is needed. Each run publishes the APK to
# a GitHub release; the latest one is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/Arangam.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://arangam-api.onrender.com/api
      CI: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Give every build a higher version code (so a new APK installs over the old one)
        run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build release APK
        working-directory: mobile/android
        # Phones only (ARM); skipping the x86 emulator builds halves the build time and the APK size.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/Arangam.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: Arangam-apk
          path: ${{ runner.temp }}/Arangam.apk
          retention-days: 30

      - name: Publish to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="apk-${{ github.run_number }}"
          gh release create "$tag" "$RUNNER_TEMP/Arangam.apk" \
            --target "${{ github.sha }}" \
            --title "Arangam Android build ${{ github.run_number }}" \
            --notes "Demo APK built from ${GITHUB_SHA::7}. Talks to https://arangam-api.onrender.com. Install on Android: open this page on the phone, tap Arangam.apk, allow installs from this source." \
            --latest
